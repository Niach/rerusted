# Spike (#RUST-23): a gpui window, a gpui panel and a gpui overlay as clients
# of the compositor. A cargo root of its own, so the workspace never builds zed.
[package]
name = "gpui-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
# Layer shell is in zed's main branch, not in gpui 0.2.2 on crates.io.
gpui = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c", default-features = false, features = ["wayland"] }

[lints.rust]
unsafe_code = "forbid"
