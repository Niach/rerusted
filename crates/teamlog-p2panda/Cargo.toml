[package]
name = "teamlog-p2panda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
teamlog = { path = "../teamlog" }
p2panda-auth = "=0.8.0"
p2panda-core = "=0.8.0"
p2panda-encryption = "=0.8.0"
p2panda-spaces = "=0.8.0"
p2panda-store = { version = "=0.8.0", default-features = false, features = ["sqlite", "spaces"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"

[dev-dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

[lints]
workspace = true
