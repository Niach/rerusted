[package]
name = "compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Spike: a minimal Wayland compositor with outputs, seats and agent spaces as first-class parts of the model."

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_pixman",
    "renderer_gl",
    "backend_winit",
    "xwayland",
] }
png = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
tempfile = "3"

[lints]
workspace = true
